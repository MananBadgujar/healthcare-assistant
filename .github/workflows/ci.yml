name: Healthcare Assistant CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-docker:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x ./mvnw

      - name: Generate CI JWT secret
        run: |
          echo "JWT_SECRET=$(openssl rand -base64 32)" >> "$GITHUB_ENV"

      - name: Run tests
        run: ./mvnw -B -ntp -f platform/pom.xml test

      - name: Package platform services
        run: ./mvnw -B -ntp -f platform/pom.xml package -DskipTests

      - name: Helm lint
        run: |
          curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
          helm lint platform/helm/healthcare-platform

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Verify service Dockerfiles
        run: |
          count=0
          for service_dir in platform/*; do
            if [ -f "$service_dir/Dockerfile" ]; then
              echo "Dockerfile: $service_dir/Dockerfile"
              count=$((count + 1))
            fi
          done

          echo "Dockerfiles found: $count"

          test "$count" -gt 0

      - name: Download OpenTelemetry Java Agent
        run: |
          mkdir -p platform/auth-service/otel

          curl -L --fail --retry 3 \
            -o platform/auth-service/otel/opentelemetry-javaagent.jar \
            https://github.com/open-telemetry/opentelemetry-java-instrumentation/releases/download/v2.31.1/opentelemetry-javaagent.jar

          test -s platform/auth-service/otel/opentelemetry-javaagent.jar

      - name: Build all service images
        run: |
          set -e

          for service_dir in platform/*; do
            if [ -f "$service_dir/Dockerfile" ]; then
              service="$(basename "$service_dir")"

              echo "=========================================="
              echo "Building: $service"
              echo "=========================================="

              docker build \
                -t "healthcare/${service}:${GITHUB_SHA}" \
                "$service_dir"
            fi
          done

      - name: Verify auth-service OTel image
        run: |
          docker run --rm \
            --entrypoint sh \
            "healthcare/auth-service:${GITHUB_SHA}" \
            -c 'ls -lh /app/app.jar /app/opentelemetry-javaagent.jar'

      - name: Git diff check
        run: git diff --check
