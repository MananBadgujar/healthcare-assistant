name: Healthcare Assistant CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-docker:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      kafka:
        image: apache/kafka:3.9.1
        ports:
          - 9092:9092
        env:
          KAFKA_NODE_ID: 1
          KAFKA_PROCESS_ROLES: broker,controller
          KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
          KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
          KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
          KAFKA_NUM_PARTITIONS: 1

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x ./mvnw

      - name: Generate CI JWT secret
        run: |
          echo "JWT_SECRET=$(openssl rand -base64 32)" >> "$GITHUB_ENV"

      - name: Wait for Kafka
        run: |
          for i in {1..60}; do
            if (echo > /dev/tcp/127.0.0.1/9092) >/dev/null 2>&1; then
              echo "Kafka port is ready"
              exit 0
            fi
            sleep 2
          done
          echo "Kafka did not become ready"
          exit 1

      - name: Run tests
        run: ./mvnw -B -ntp -f platform/pom.xml test

      - name: Package platform services
        run: ./mvnw -B -ntp -f platform/pom.xml package -DskipTests

      - name: Helm lint
        run: |
          curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
          helm lint platform/helm/healthcare-platform

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Verify service Dockerfiles
        run: |
          count=0
          for service_dir in platform/*; do
            if [ -f "$service_dir/Dockerfile" ]; then
              echo "Dockerfile: $service_dir/Dockerfile"
              count=$((count + 1))
            fi
          done

          echo "Dockerfiles found: $count"

          test "$count" -gt 0

      - name: Download OpenTelemetry Java Agent
        run: |
          mkdir -p platform/auth-service/otel

          curl -L --fail --retry 3 \
            -o platform/auth-service/otel/opentelemetry-javaagent.jar \
            https://github.com/open-telemetry/opentelemetry-java-instrumentation/releases/download/v2.31.1/opentelemetry-javaagent.jar

          test -s platform/auth-service/otel/opentelemetry-javaagent.jar

      - name: Build all service images
        run: |
          set -e

          for service_dir in platform/*; do
            if [ -f "$service_dir/Dockerfile" ]; then
              service="$(basename "$service_dir")"

              echo "=========================================="
              echo "Building: $service"
              echo "=========================================="

              docker build \
                -t "healthcare/${service}:${GITHUB_SHA}" \
                "$service_dir"
            fi
          done

      - name: Verify auth-service OTel image
        run: |
          docker run --rm \
            --entrypoint sh \
            "healthcare/auth-service:${GITHUB_SHA}" \
            -c 'ls -lh /app/app.jar /app/opentelemetry-javaagent.jar'

      - name: Git diff check
        run: git diff --check
