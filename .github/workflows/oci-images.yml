name: OCI Multi-Arch Images

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Package platform services
        env:
          JWT_SECRET: REMOVED_STATIC_CI_SECRET
        run: |
          ./mvnw -B -ntp -f platform/pom.xml package -DskipTests

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download OpenTelemetry Java Agent
        run: |
          mkdir -p platform/auth-service/otel
          curl -fsSL \
            -o platform/auth-service/otel/opentelemetry-javaagent.jar \
            https://github.com/open-telemetry/opentelemetry-java-instrumentation/releases/download/v2.31.1/opentelemetry-javaagent.jar
          test -s platform/auth-service/otel/opentelemetry-javaagent.jar

      - name: Build and push ARM64 + AMD64 images
        env:
          REGISTRY: ghcr.io/mananbadgujar
        run: |
          set -euo pipefail

          for service_dir in platform/*; do
            if [ -f "$service_dir/Dockerfile" ]; then
              service="$(basename "$service_dir")"
              image="$REGISTRY/healthcare-assistant-$service"

              echo "=========================================="
              echo "Building: $image"
              echo "Platforms: linux/amd64,linux/arm64"
              echo "=========================================="

              docker buildx build \
                --platform linux/amd64,linux/arm64 \
                --tag "$image:${GITHUB_SHA}" \
                --tag "$image:latest" \
                --label "org.opencontainers.image.source=https://github.com/MananBadgujar/healthcare-assistant" \
                --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
                --push \
                "$service_dir"
            fi
          done
