apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    scrape_configs:
      - job_name: healthcare-services
        metrics_path: /actuator/prometheus
        static_configs:
          - targets:
              - auth-service.healthcare.svc.cluster.local:8101
            labels:
              service: auth-service
          - targets:
              - patient-service.healthcare.svc.cluster.local:8102
            labels:
              service: patient-service
          - targets:
              - provider-service.healthcare.svc.cluster.local:8103
            labels:
              service: provider-service
          - targets:
              - appointment-service.healthcare.svc.cluster.local:8104
            labels:
              service: appointment-service
          - targets:
              - medication-service.healthcare.svc.cluster.local:8105
            labels:
              service: medication-service
          - targets:
              - billing-service.healthcare.svc.cluster.local:8106
            labels:
              service: billing-service
          - targets:
              - ai-service.healthcare.svc.cluster.local:8107
            labels:
              service: ai-service
          - targets:
              - rag-service.healthcare.svc.cluster.local:8108
            labels:
              service: rag-service
          - targets:
              - cds-service.healthcare.svc.cluster.local:8109
            labels:
              service: cds-service
          - targets:
              - notification-service.healthcare.svc.cluster.local:8110
            labels:
              service: notification-service
          - targets:
              - inventory-service.healthcare.svc.cluster.local:8111
            labels:
              service: inventory-service
          - targets:
              - api-gateway.healthcare.svc.cluster.local:8080
            labels:
              service: api-gateway
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prometheus-data
  namespace: monitoring
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v2.55.1
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=24h
            - --web.enable-lifecycle
          ports:
            - name: http
              containerPort: 9090
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /-/ready
              port: 9090
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: 9090
            initialDelaySeconds: 30
            periodSeconds: 20
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
              readOnly: true
            - name: data
              mountPath: /prometheus
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        - name: data
          persistentVolumeClaim:
            claimName: prometheus-data
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: monitoring
spec:
  selector:
    app: prometheus
  ports:
    - name: http
      port: 9090
      targetPort: 9090
  type: ClusterIP
