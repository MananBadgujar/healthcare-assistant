replicas: 1

tempo:
  repository: grafana/tempo
  tag: "3.0.3"
  pullPolicy: IfNotPresent

  reportingEnabled: false

  metricsGenerator:
    enabled: false

  retention: 24h

  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi

  server:
    http_listen_port: 3200

  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: "0.0.0.0:4317"
        http:
          endpoint: "0.0.0.0:4318"

  storage:
    trace:
      backend: local
      local:
        path: /var/tempo/traces
      wal:
        path: /var/tempo/wal

persistence:
  enabled: true
  storageClassName: local-path
  accessModes:
    - ReadWriteOnce
  size: 2Gi

tempoQuery:
  enabled: false

serviceMonitor:
  enabled: false
