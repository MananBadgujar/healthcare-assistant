---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: healthcare
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: platform-api-gateway:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          env:
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: jwt-secret
                  key: JWT_SECRET
            - name: AUTH_URL
              value: http://auth-service:8101
            - name: PATIENT_URL
              value: http://patient-service:8102
            - name: PROVIDER_URL
              value: http://provider-service:8103
            - name: APPOINTMENT_URL
              value: http://appointment-service:8104
            - name: MEDICATION_URL
              value: http://medication-service:8105
            - name: BILLING_URL
              value: http://billing-service:8106
            - name: AI_URL
              value: http://ai-service:8107
            - name: RAG_URL
              value: http://rag-service:8108
            - name: CDS_URL
              value: http://cds-service:8109
            - name: NOTIFICATION_URL
              value: http://notification-service:8110
            - name: INVENTORY_URL
              value: http://inventory-service:8111
            - name: MONOLITH_URL
              value: http://monolith:8080
          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3

---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: healthcare
spec:
  type: NodePort
  selector:
    app: api-gateway
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      nodePort: 30080