spring.application.name=healthcare-assistant
server.port=8080
spring.datasource.url=jdbc:h2:mem:phase9live;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.security.csrf.enabled=false

# JWT secret
jwt.secret=${JWT_SECRET}

# Cache
spring.cache.type=none

# Phase 9 RAG
rag.embedding.provider=hash
rag.embedding.dimension=256
rag.generation.fallback-on-llm-error=true
ai.ollama.base-url=http://localhost:11434
ai.ollama.model=tinyllama:latest
