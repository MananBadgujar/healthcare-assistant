kafka.topics.inventory.low-stock=healthcare.inventory.events.low-stock
kafka.topics.inventory.near-expiry=healthcare.inventory.events.near-expiry
kafka.topics.inventory.stock-received=healthcare.inventory.events.stock-received
kafka.topics.inventory.stock-consumed=healthcare.inventory.events.stock-consumed
kafka.topics.inventory.stock-transferred=healthcare.inventory.events.stock-transferred
kafka.topics.inventory.batch-near-expiry=healthcare.inventory.events.batch-near-expiry
kafka.topics.inventory.item-expired=healthcare.inventory.events.item-expired
kafka.topics.inventory.reorder-recommended=healthcare.inventory.events.reorder-recommended

kafka.topics.telehealth.session-completed=healthcare.telehealth.events.session-completed
