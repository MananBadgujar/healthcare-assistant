jwt.secret=${JWT_SECRET}
spring.security.csrf.enabled=false

spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Phase 9 RAG - use deterministic hashing embeddings and LLM fallback in tests
rag.embedding.provider=hash
rag.embedding.dimension=256
rag.generation.fallback-on-llm-error=true
ai.ollama.base-url=http://localhost:11434
ai.ollama.model=llama2

# Topic configuration for tests
kafka.topics.patient.created=healthcare.patient.events.created
kafka.topics.patient.updated=healthcare.patient.events.updated

kafka.topics.appointment.created=healthcare.appointment.events.created
kafka.topics.appointment.updated=healthcare.appointment.events.updated
kafka.topics.appointment.cancelled=healthcare.appointment.events.cancelled
kafka.topics.appointment.confirmed=healthcare.appointment.events.confirmed
kafka.topics.appointment.no-show=healthcare.appointment.events.no-show
kafka.topics.appointment.status-changed=healthcare.appointment.events.status-changed

kafka.topics.encounter.completed=healthcare.encounter.events.completed
kafka.topics.encounter.lab-result=healthcare.encounter.events.lab-result
kafka.topics.encounter.clinical-alert=healthcare.encounter.events.clinical-alert
kafka.topics.encounter.care-plan-approved=healthcare.encounter.events.care-plan-approved
kafka.topics.encounter.medication-changed=healthcare.encounter.events.medication-changed
kafka.topics.encounter.triage-completed=healthcare.encounter.events.triage-completed

kafka.topics.medication.created=healthcare.medication.events.created
kafka.topics.medication.refill-requested=healthcare.medication.events.refill-requested

kafka.topics.billing.payment-completed=healthcare.billing.events.payment-completed
kafka.topics.billing.claim-submitted=healthcare.billing.events.claim-submitted
kafka.topics.billing.claim-approved=healthcare.billing.events.claim-approved
kafka.topics.billing.claim-rejected=healthcare.billing.events.claim-rejected

kafka.topics.claim.events=healthcare.claim.events
kafka.topics.claim.submitted=healthcare.claim.events.submitted
kafka.topics.claim.approved=healthcare.claim.events.approved
kafka.topics.claim.rejected=healthcare.claim.events.rejected

kafka.topics.ai.lab-interpretation=healthcare.ai.events.lab-interpretation
kafka.topics.ai.clinical-alert=healthcare.ai.events.clinical-alert
kafka.topics.ai.triage-completed=healthcare.ai.events.triage-completed

kafka.topics.notification.appointment-reminder=healthcare.notification.events.appointment-reminder
kafka.topics.notification.appointment-cancellation=healthcare.notification.events.appointment-cancellation
kafka.topics.notification.payment-confirmation=healthcare.notification.events.payment-confirmation
