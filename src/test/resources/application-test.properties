# Consumer group IDs
kafka.consumer.group.id.patient=patient-consumer-group
kafka.consumer.group.id.appointment=appointment-consumer-group
kafka.consumer.group.id.encounter=encounter-consumer-group
kafka.consumer.group.id.medication=medication-consumer-group
kafka.consumer.group.id.billing=billing-consumer-group
kafka.consumer.group.id.claim=claim-consumer-group
kafka.consumer.group.id.ai=ai-consumer-group
kafka.consumer.group.id.notification=notification-consumer-group
kafka.consumer.group.id.inventory=inventory-consumer-group
kafka.consumer.group.id.telehealth=telehealth-consumer-group

# Retry configuration
kafka.retry.max-attempts=3
kafka.retry.initial-backoff-ms=1000
kafka.retry.max-backoff-ms=4000

# DLQ configuration
kafka.dlq.enabled=true